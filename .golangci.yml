version: "2"

linters:
  default: none
  # #region lint-exhaustive
  enable:
    - depguard
    - errcheck
    - exhaustive
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    # #region lint-depguard
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/*.go"
          deny:
            - pkg: github.com/docker
              desc: o domínio não depende de infraestrutura
    # #endregion
    exhaustive:
      # Um default não dispensa os casos: todo valor declarado precisa
      # aparecer no switch.
      default-signifies-exhaustive: false
  # #endregion

formatters:
  enable:
    - gofumpt

  settings:
    gofumpt:
      extra:
        group-params: true
