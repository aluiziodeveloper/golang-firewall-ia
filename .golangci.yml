version: "2"

linters:
  default: none
  # #region lint-exhaustive
  enable:
    - depguard
    - errcheck
    - exhaustive
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    # #region lint-depguard
    depguard:
      rules:
        # O domínio só usa a biblioteca padrão, e dela nada que faça I/O.
        domain:
          list-mode: strict
          files:
            - "**/internal/domain/*.go"
            - "!$test"
          allow:
            - $gostd
          deny:
            - pkg: net
              desc: o domínio não abre conexões
            - pkg: os
              desc: o domínio não toca o sistema
        # Os casos de uso dependem do domínio, nunca de adaptadores.
        app:
          list-mode: strict
          files:
            - "**/internal/app/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/aluiziodeveloper/guarita/internal/domain
    # #endregion
    exhaustive:
      # Um default não dispensa os casos: todo valor declarado precisa
      # aparecer no switch.
      default-signifies-exhaustive: false
  # #endregion
  exclusions:
    rules:
      # Testes leem testdata e iniciam processos de propósito; o gosec
      # continua valendo para todo o código de produção.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt

  settings:
    gofumpt:
      extra:
        group-params: true
